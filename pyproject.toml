[project]
name = "hybrid-fake-news-detection"
version = "0.4.0"
description = "Research scaffold for hybrid fake-news detection and evidence-grounded fact verification"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
data = [
  "pandas>=3.0,<4",
  "numpy>=2.3,<3",
  "openpyxl>=3.1,<4",
]
ml = [
  "pandas>=3.0,<4",
  "numpy>=2.3,<3",
  "scikit-learn>=1.8,<2",
  "joblib>=1.5,<2",
]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
testpaths = ["tests"]
pythonpath = ["."]
